name: 'Build totem dongle xiao_ble'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["xiao_ble//zmk"]'
      shield: '["totem_dongle","totem_left","totem_right"]'
      kconfig: '["CONFIG_ZMK_POINTING=y"]'
